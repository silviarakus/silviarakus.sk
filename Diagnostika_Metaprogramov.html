<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostika metaprogramov — FENIX</title>
<meta name="description" content="Diagnostika metaprogramov. Zisti, ako sa rozhoduješ, čo ťa poháňa a prečo konáš tak, ako konáš. FENIX — Silvia Rakus.">
<meta property="og:title" content="Diagnostika metaprogramov — FENIX">
<meta property="og:description" content="Spoznaj svoj komunikačný kód — 12 nastavení, cez ktoré spracúvaš svet.">
<meta property="og:type" content="website">
<meta property="og:locale" content="sk_SK">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* FENIX paleta — fenixbrandmanual.md §7 */
  --obsidian:#0B0D10;
  --deep-charcoal:#11151A;
  --graphite:#1C2128;
  --graphite-2:#20262e;
  --bone:#F5F1E8;
  --ash-grey:#8E8E8E;
  --soft-sand:#D8C7AA;
  --ember-copper:#C66A2B;
  --electric-ember:#FF7A1A;
  --signal-red:#E84A1A;

  --ember-glow:rgba(198,106,43,0.18);
  --muted:#B5AEA2;
  --line:rgba(245,241,232,0.10);
  --line-strong:rgba(198,106,43,0.35);

  /* stavové signály diagnostiky */
  --go:#4E9E78; --go-light:#7DC5A6;
  --mid:var(--ember-copper);
  --no:var(--signal-red); --no-light:#F0836A;

  --font-display:'Sora','Montserrat',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Manrope',ui-sans-serif,system-ui,sans-serif;
  color-scheme: dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:var(--font-body);background:var(--obsidian);color:var(--bone);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 20% 0%,rgba(198,106,43,0.10),transparent 45%),radial-gradient(circle at 85% 100%,rgba(198,106,43,0.06),transparent 50%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
.app{max-width:820px;margin:0 auto;padding:24px}
::selection{background:var(--ember-copper);color:var(--bone)}
:focus-visible{outline:2px solid var(--ember-copper);outline-offset:3px;border-radius:4px}

/* BRAND CHROME */
.brand-bar{border-bottom:1px solid var(--line);background:var(--deep-charcoal)}
.brand-bar-inner{max-width:820px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand-bar a{display:block}
.brand-bar img{display:block;height:30px;width:auto}
.brand-bar span{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ash-grey)}
.site-footer{border-top:1px solid var(--line);background:var(--deep-charcoal);margin-top:60px}
.site-footer-inner{max-width:820px;margin:0 auto;padding:26px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;font-size:13px;color:var(--ash-grey)}
.site-footer img{display:block;height:24px;width:auto}
.site-footer a{color:var(--ember-copper);text-decoration:none}
.site-footer a:hover{color:var(--electric-ember)}

/* INTRO + INTERSTITIAL */
.intro{min-height:calc(100vh - 63px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 20px;animation:fadeIn 1s ease}
.intro-logo{width:min(200px,58vw);height:auto;margin-bottom:30px;filter:drop-shadow(0 0 30px rgba(198,106,43,0.30));animation:rise 1.3s cubic-bezier(0.2,0.7,0.2,1);user-select:none}
.intro-brand-sub{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--ash-grey);margin-bottom:40px}
.intro h1{font-family:var(--font-display);font-size:clamp(32px,6vw,52px);font-weight:700;line-height:1.15;letter-spacing:-0.01em;margin-bottom:22px}
.intro h1 em{font-style:normal;background:linear-gradient(120deg,var(--ember-copper),var(--electric-ember));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.intro-desc{font-size:16px;font-weight:400;color:var(--muted);max-width:540px;line-height:1.75;margin-bottom:14px}
.intro-meta{font-size:12px;letter-spacing:1px;color:var(--ash-grey);margin-bottom:44px}
.intro-form{width:100%;max-width:400px;margin-bottom:30px}
.intro-form input{width:100%;padding:17px 22px;font-family:var(--font-body);font-size:15px;border:1px solid var(--line-strong);border-radius:4px;background:rgba(245,241,232,0.03);color:var(--bone);outline:none;transition:all .35s;letter-spacing:.5px}
.intro-form input:focus{border-color:var(--ember-copper);background:rgba(198,106,43,0.06);box-shadow:0 0 0 4px var(--ember-glow)}
.intro-form input::placeholder{color:var(--ash-grey)}
.btn-primary{display:inline-flex;align-items:center;gap:12px;padding:16px 44px;font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--obsidian);background:linear-gradient(120deg,var(--ember-copper),var(--electric-ember));border:none;border-radius:60px;cursor:pointer;transition:all .45s cubic-bezier(.4,0,.2,1)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(198,106,43,0.40)}
.btn-primary:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.part-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:8px 20px;border:1px solid var(--line-strong);border-radius:30px;color:var(--ember-copper);margin-bottom:26px}

/* PROGRESS */
.progress-wrap{position:sticky;top:0;z-index:100;background:rgba(11,13,16,0.92);backdrop-filter:blur(14px);padding:18px 0;margin-bottom:24px;border-bottom:1px solid var(--line)}
.progress-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.progress-label{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--ash-grey)}
.progress-count{font-family:var(--font-display);font-size:22px;font-weight:600}
.progress-count em{color:var(--ash-grey);font-style:normal;font-size:16px}
.progress-bar{height:3px;background:rgba(245,241,232,0.06);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ember-copper),var(--electric-ember));border-radius:4px;transition:width .55s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(198,106,43,0.5)}
.mp-label{font-size:10px;font-weight:600;color:var(--ember-copper);letter-spacing:2px;text-transform:uppercase;margin-top:10px}

/* QUESTION */
.question-card{animation:slideUp .55s cubic-bezier(.4,0,.2,1)}
.question-number{font-family:var(--font-display);font-size:72px;font-weight:700;color:rgba(198,106,43,0.18);line-height:1;margin-bottom:4px}
.question-text{font-family:var(--font-display);font-size:clamp(22px,4vw,30px);font-weight:600;line-height:1.35;margin-bottom:32px}
.options{display:flex;flex-direction:column;gap:12px}
.option{display:flex;align-items:flex-start;gap:16px;padding:19px 24px;background:var(--graphite);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .28s cubic-bezier(.4,0,.2,1);user-select:none;position:relative;overflow:hidden}
.option::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ember-copper),var(--electric-ember));transform:scaleY(0);transition:transform .3s}
.option:hover{border-color:var(--line-strong);transform:translateX(5px);background:var(--graphite-2)}
.option.selected{border-color:var(--ember-copper);background:rgba(198,106,43,0.08)}
.option.selected::before{transform:scaleY(1)}
.option-radio{width:20px;height:20px;min-width:20px;border:1.5px solid var(--ash-grey);border-radius:50%;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .3s}
.option.selected .option-radio{border-color:var(--ember-copper);background:linear-gradient(var(--ember-copper),var(--electric-ember))}
.option.selected .option-radio::after{content:'';width:6px;height:6px;background:var(--obsidian);border-radius:50%}
.option-text{font-size:15px;font-weight:400;line-height:1.55;color:var(--muted)}
.option.selected .option-text{color:var(--bone);font-weight:500}
.nav-buttons{display:flex;justify-content:space-between;margin-top:36px;gap:12px}
.btn-back{padding:14px 30px;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ash-grey);background:transparent;border:1px solid var(--line);border-radius:60px;cursor:pointer;transition:all .3s}
.btn-back:hover{border-color:var(--line-strong);color:var(--muted)}
.btn-next{padding:14px 38px;font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--obsidian);background:linear-gradient(120deg,var(--ember-copper),var(--electric-ember));border:none;border-radius:60px;cursor:pointer;transition:all .3s}
.btn-next:hover{box-shadow:0 6px 24px rgba(198,106,43,0.35);transform:translateY(-1px)}
.btn-next:disabled{opacity:.25;cursor:not-allowed;box-shadow:none;transform:none;background:var(--graphite-2);color:var(--ash-grey)}

/* RESULTS SHARED */
.results{animation:fadeIn .9s ease}
.results-header{text-align:center;padding:30px 0 18px}
.results-logo{width:132px;height:auto;margin:0 auto 18px;filter:drop-shadow(0 0 22px rgba(198,106,43,0.30))}
.results-header h1{font-family:var(--font-display);font-size:clamp(26px,4.5vw,38px);font-weight:700;margin-bottom:8px}
.results-header .name{font-family:var(--font-display);font-size:20px;font-weight:400;color:var(--soft-sand)}
.results-header .date{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ash-grey);margin-top:10px}

.view-switch{display:flex;gap:8px;justify-content:center;margin:22px 0 30px;flex-wrap:wrap}
.view-btn{padding:12px 26px;font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border-radius:40px;cursor:pointer;transition:all .3s;background:transparent;border:1px solid var(--line);color:var(--ash-grey)}
.view-btn.active{background:linear-gradient(120deg,var(--ember-copper),var(--electric-ember));border-color:transparent;color:var(--obsidian)}
.view-btn:not(.active):hover{border-color:var(--line-strong);color:var(--muted)}

.section-title{font-family:var(--font-display);font-size:20px;font-weight:600;margin:34px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line);letter-spacing:.5px}
.lead-box{background:linear-gradient(155deg,var(--graphite-2),var(--graphite));border:1px solid var(--line-strong);border-radius:16px;padding:28px 30px;margin:8px 0 10px}
.lead-box h3{font-family:var(--font-display);font-size:21px;font-weight:700;color:var(--soft-sand);margin-bottom:10px}
.lead-box p{font-size:14px;font-weight:400;color:var(--muted);line-height:1.75}
.lead-box p+p{margin-top:10px}
.lead-box strong{color:var(--bone);font-weight:600}

/* CLIENT MP CARD */
.mp-card{background:var(--graphite);border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin-bottom:18px;transition:all .3s}
.mp-card:hover{border-color:var(--line-strong)}
.mp-card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.mp-name{font-family:var(--font-display);font-size:21px;font-weight:600}
.mp-badge{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 15px;border-radius:20px;background:linear-gradient(120deg,var(--ember-copper),var(--electric-ember));color:var(--obsidian);white-space:nowrap}
.mp-strength{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ash-grey);margin-bottom:14px}
.mp-bar-wrap{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mp-bar-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--ash-grey);min-width:125px;text-align:right}
.mp-bar-label.active{color:var(--ember-copper);font-weight:700}
.mp-bar{flex:1;height:6px;background:rgba(245,241,232,0.05);border-radius:8px;overflow:hidden}
.mp-bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ember-copper),var(--electric-ember));box-shadow:0 0 10px rgba(198,106,43,0.4)}
.mp-bar-label-r{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--ash-grey);min-width:125px}
.mp-bar-label-r.active{color:var(--ember-copper);font-weight:700}
.mp-block{padding:13px 17px;border-radius:10px;margin-bottom:10px;font-size:13.5px;font-weight:400;line-height:1.65;color:var(--muted);background:rgba(0,0,0,0.25)}
.mp-block b{display:block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.mp-block.mean{border-left:2px solid var(--soft-sand)}
.mp-block.mean b{color:var(--soft-sand)}
.mp-block.plus{border-left:2px solid var(--go)}
.mp-block.plus b{color:var(--go-light)}
.mp-block.minus{border-left:2px solid var(--no)}
.mp-block.minus b{color:var(--no-light)}

/* ADVISOR */
.advisor-note{background:rgba(198,106,43,0.08);border:1px solid var(--line-strong);border-radius:12px;padding:16px 20px;margin-bottom:22px;font-size:13px;line-height:1.65;color:var(--muted)}
.advisor-note strong{color:var(--soft-sand);font-weight:600}
.code-group{margin-bottom:18px}
.code-group-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ember-copper);margin-bottom:10px}
.code-tags{display:flex;flex-wrap:wrap;gap:8px}
.code-tag{font-size:12px;font-weight:400;padding:8px 15px;border-radius:30px;background:rgba(198,106,43,0.10);border:1px solid var(--line);color:var(--bone)}
.code-tag.strong{background:linear-gradient(120deg,rgba(198,106,43,0.28),rgba(255,122,26,0.20));border-color:var(--ember-copper);color:var(--soft-sand);font-weight:600}
.tip-row{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid rgba(245,241,232,0.04);align-items:flex-start}
.tip-name{min-width:190px;font-size:13px;font-weight:600;color:var(--bone)}
.tip-name span{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ember-copper);margin-top:3px;font-weight:500}
.tip-text{flex:1;font-size:13px;font-weight:400;color:var(--muted);line-height:1.6}

.verdict{display:flex;align-items:center;gap:30px;background:linear-gradient(155deg,var(--graphite-2),var(--graphite));border:1px solid var(--line-strong);border-left-width:4px;border-radius:18px;padding:30px;margin:8px 0 10px}
.verdict.go{border-left-color:var(--go)}.verdict.mid{border-left-color:var(--mid)}.verdict.no{border-left-color:var(--no)}
.gauge{width:140px;height:140px;min-width:140px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.gauge-inner{width:112px;height:112px;border-radius:50%;background:var(--deep-charcoal);display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-pct{font-family:var(--font-display);font-size:38px;font-weight:700;line-height:1}
.gauge-cap{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ash-grey);margin-top:4px}
.verdict-body{flex:1}
.verdict-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 16px;border-radius:30px;margin-bottom:12px}
.verdict.go .verdict-tag{background:rgba(78,158,120,0.15);border:1px solid var(--go);color:var(--go-light)}
.verdict.mid .verdict-tag{background:rgba(198,106,43,0.15);border:1px solid var(--mid);color:var(--electric-ember)}
.verdict.no .verdict-tag{background:rgba(232,74,26,0.15);border:1px solid var(--no);color:var(--no-light)}
.verdict-title{font-family:var(--font-display);font-size:24px;font-weight:700;margin-bottom:8px}
.verdict-desc{font-size:14px;font-weight:400;color:var(--muted);line-height:1.6}

.dim-row{display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid rgba(245,241,232,0.04)}
.dim-name{font-size:14px;min-width:210px;color:var(--bone)}
.dim-bar{flex:1;height:7px;background:rgba(245,241,232,0.05);border-radius:8px;overflow:hidden}
.dim-fill{height:100%;border-radius:8px}
.dim-fill.s{background:linear-gradient(90deg,var(--go),var(--go-light))}
.dim-fill.m{background:linear-gradient(90deg,var(--ember-copper),var(--electric-ember))}
.dim-fill.w{background:linear-gradient(90deg,var(--no),var(--no-light))}
.dim-score{font-size:13px;font-weight:700;min-width:46px;text-align:right}
.dim-score.s{color:var(--go-light)}.dim-score.m{color:var(--electric-ember)}.dim-score.w{color:var(--no-light)}

.print-btn{display:block;width:100%;padding:18px;font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-align:center;color:var(--obsidian);background:linear-gradient(120deg,var(--ember-copper),var(--electric-ember));border:none;border-radius:60px;cursor:pointer;margin-top:32px;transition:all .35s}
.print-btn:hover{box-shadow:0 10px 40px rgba(198,106,43,0.40);transform:translateY(-2px)}
.restart-btn{display:block;width:100%;padding:14px;font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-align:center;color:var(--ash-grey);background:transparent;border:1px solid var(--line);border-radius:60px;cursor:pointer;margin-top:12px;transition:all .3s}
.restart-btn:hover{border-color:var(--line-strong);color:var(--muted)}
.footer-mark{text-align:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--line);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--ash-grey)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* PRINT — dlhé pracovné a tlačové strany idú na svetlom podklade, brand manual §13 */
@media print{
  :root{
    --obsidian:#ffffff; --deep-charcoal:#ffffff; --graphite:#ffffff; --graphite-2:#ffffff;
    --bone:#11151A; --muted:#4A4A4A; --ash-grey:#6B6B6B;
    --line:#D8D3C9; --line-strong:#BDB7AA; --soft-sand:#8A6A38;
    /* akcenty stmavené, aby mali kontrast na bielom papieri */
    --electric-ember:#A8541F; --go-light:#2F6B4E; --no-light:#B33A15;
  }
  body{background:#fff;color:#11151A;background-image:none}
  /* tieto plochy majú natvrdo zadanú farbu pre tmavý režim — na papieri sa musia otočiť */
  .mp-block{background:#F7F4EE!important;color:#3A3A3A!important}
  .mp-bar,.dim-bar{background:#E5E0D6!important}
  /* 11px biely text na medenej nemá na papieri dosť kontrastu — stmavíme podklad */
  .mp-badge{background:#8A4718!important}
  .mp-bar-fill,.progress-fill{box-shadow:none!important}
  .progress-wrap,.nav-buttons,.print-btn,.restart-btn,.btn-primary,.view-switch,
  .brand-bar span,.site-footer{display:none!important}
  .brand-bar{border-bottom:1px solid var(--line);margin-bottom:20px}
  .mp-card,.verdict,.lead-box,.tip-row,.advisor-note{break-inside:avoid}
  .mp-card,.lead-box,.verdict,.advisor-note{border:1px solid var(--line)!important;box-shadow:none!important}
  .intro-logo,.results-logo{filter:none!important}
}
@media (max-width:640px){
  .app{padding:14px}
  .verdict{flex-direction:column;text-align:center}
  .mp-bar-wrap{flex-direction:column;align-items:stretch;gap:6px}
  .mp-bar-label,.mp-bar-label-r{text-align:left;min-width:auto}
  .tip-row{flex-direction:column;gap:6px}
  .tip-name{min-width:100%}
  .dim-row{flex-wrap:wrap}.dim-name{min-width:100%}
}
</style>
</head>
<body>

<header class="brand-bar">
  <div class="brand-bar-inner">
    <a href="index.html" aria-label="FENIX — domov">
      <img src="assets/fenix-logo-horizontal.png" alt="FENIX — Silvia Rakus">
    </a>
    <span>Diagnostika</span>
  </div>
</header>

<div class="app" id="app"></div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <img src="assets/fenix-logo-horizontal.png" alt="FENIX">
    <span>Silvia Rakus · <a href="index.html">silviarakus.sk</a></span>
  </div>
</footer>

<script>
/* ===== LOGO =====
   Uzamknutý symbol FENIX podľa brand manuálu §4 — používa sa výhradne
   dodaný obrazový súbor, symbol sa neprekresľuje ani nezjednodušuje. */

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepareMpQuestions(){
  const groups={}; MP_QUESTIONS.forEach(q=>{ (groups[q.mp]=groups[q.mp]||[]).push(q); });
  Object.keys(groups).forEach(k=>{ groups[k]=shuffle(groups[k]); });
  const out=[];
  for(let r=0;r<3;r++){ shuffle(META_PROGRAMS).forEach(mp=>{ const g=groups[mp.id]; if(g&&g[r]) out.push(g[r]); }); }
  return out;
}

/* ============ VÝPOČTY ============ */
function computeMp(){
  const scores={}; META_PROGRAMS.forEach(mp=>scores[mp.id]={a:0,b:0});
  state.mpQuestions.forEach((q,i)=>{ const a=state.mpAnswers[i]; if(a==='a'||a==='b') scores[q.mp][a]++; });
  return META_PROGRAMS.map(mp=>{
    const s=scores[mp.id]; const tot=s.a+s.b||1;
    const pctA=Math.round((s.a/tot)*100); const pctB=100-pctA;
    const dominant=pctA>=pctB?'a':'b';
    return { mp, pctA, pctB, dominant,
      domName: dominant==='a'?mp.a:mp.b,
      prof: dominant==='a'?mp.profA:mp.profB,
      tip: dominant==='a'?mp.tipA:mp.tipB,
      strong: Math.max(pctA,pctB)===100 };
  });
}
function computeRd(){
  const pts={}; DIMENSIONS.forEach(d=>pts[d.id]=0);
  RD_QUESTIONS.forEach((q,i)=>{ const a=state.rdAnswers[i]; if(a!==undefined) pts[q.dim]+=q.options[a].p; });
  const results=DIMENSIONS.map(d=>({ ...d, pct: Math.round((pts[d.id]/6)*100) }));
  const totalPct=Math.round(results.reduce((s,r)=>s+r.pct,0)/results.length);
  return { results, totalPct };
}
function tier(pct){
  if(pct>=78) return {key:'go',tag:'Ideálny kandidát',title:'Zaraď do FENIX',desc:'Klient je pripravený naprieč oblasťami — zrelý na priamu ponuku a uzatvorenie.'};
  if(pct>=55) return {key:'mid',tag:'Perspektívny — dozrieť',title:'Ešte nie je zrelý na uzavretie',desc:'Potenciál tu je, ale niektoré oblasti treba doriešiť. Naplánuj follow-up, nie priame uzatvorenie.'};
  return {key:'no',tag:'Zatiaľ nevhodný',title:'Nezaraďuj teraz',desc:'Nespĺňa základné podmienky pripravenosti. Dlhodobý nurturing alebo menší vstupný krok.'};
}

      </div>
      <div class="mp-block mean"><b>Čo to o tebe hovorí</b>${esc(prof.vyzn)}</div>
      <div class="mp-block plus"><b>Tvoja silná stránka</b>${esc(prof.plus)}</div>
      <div class="mp-block minus"><b>Na čo si dať pozor</b>${esc(prof.minus)}</div>
    </div>`;
  }).join('');

  return `
  <div class="lead-box">
    <h3>Ako čítať tento dokument</h3>
    <p>Metaprogramy sú <strong>nevedomé filtre, cez ktoré spracúvaš svet</strong> — rozhodujú o tom, čo ťa motivuje, ako sa rozhoduješ a prečo konáš tak, ako konáš. Nie sú dobré ani zlé. Každé nastavenie má situácie, kde ti slúži, a situácie, kde ťa brzdí.</p>
    <p>Nižšie nájdeš <strong>12 svojich nastavení</strong>. Pri každom: čo to o tebe hovorí (ako si sa doteraz rozhodoval), kde je tvoja sila — a kde si dať pozor, aby ťa vlastné nastavenie nestálo výsledky. ${strongCount>0?`<strong>${strongCount} z 12</strong> nastavení máš výrazných — tie sa v tvojom správaní prejavujú najsilnejšie.`:''}</p>
    <p>Sila tohto dokumentu nie je v prečítaní, ale v spätnom pohľade: pri každom nastavení si spomeň na konkrétnu situáciu z poslednej doby, kde sa prejavilo. Vtedy sa z popisu stane sebapoznanie.</p>
  </div>
  <div class="section-title">Tvojich 12 nastavení</div>
  ${cards}
  <div class="lead-box">
    <h3>Čo s tým ďalej</h3>
    <p>Silné stránky sú tvoja prirodzená výhoda — <strong>stavaj na nich vedome</strong>, nie náhodou. Rizikové miesta neznamenajú, že sa máš zmeniť. Znamenajú, že v týchto situáciách potrebuješ <strong>systém, oporu alebo človeka</strong>, ktorý tvoje slepé miesto pokryje. Presne o tom bude náš ďalší rozhovor.</p>
  </div>`;
}

function renderAdvisorDoc(){
  const mpRes=computeMp();
  const {results,totalPct}=computeRd();
  const t=tier(totalPct);
  const accent=t.key==='go'?'var(--go)':(t.key==='mid'?'var(--mid)':'var(--no)');
  const sorted=[...results].sort((a,b)=>b.pct-a.pct);
  const strongest=sorted[0], weakest=sorted[sorted.length-1];

  const strongTags=mpRes.filter(x=>x.strong).map(x=>`<span class="code-tag strong">${esc(x.mp.name)}: ${esc(x.domName)}</span>`).join('');
  const mildTags=mpRes.filter(x=>!x.strong).map(x=>`<span class="code-tag">${esc(x.mp.name)}: ${esc(x.domName)}</span>`).join('');

  const tips=mpRes.map(x=>`
    <div class="tip-row">
      <div class="tip-name">${esc(x.mp.name)}<span>${esc(x.domName)}${x.strong?' · silná':''}</span></div>
      <div class="tip-text">${esc(x.tip)}</div>
    </div>`).join('');

  const dimRows=results.map(r=>{
    const c=stratClass(r.pct);
    return `<div class="dim-row"><div class="dim-name">${esc(r.name)}</div><div class="dim-bar"><div class="dim-fill ${c}" style="width:${r.pct}%"></div></div><div class="dim-score ${c}">${r.pct}%</div></div>`;
  }).join('');

  let nextStep;
  if(t.key==='go') nextStep=`<p><strong>Prezentuj plnú ponuku a smeruj k uzavretiu.</strong> Kľúčová páka: ${esc(strongest.name.toLowerCase())} — ${esc(strongest.build)} Celú prezentáciu veď v jeho komunikačnom kóde (vyššie).</p>`;
  else if(t.key==='mid') nextStep=`<p><strong>Najprv dorieš najslabšiu oblasť.</strong> ${esc(weakest.fix)} Follow-up naplánuj konkrétne — a komunikuj ho v jeho metaprogramovom kóde, nie vo svojom.</p>`;
  else nextStep=`<p><strong>Nezaraďuj do priamej ponuky.</strong> Hlavná prekážka: ${esc(weakest.name.toLowerCase())}. ${esc(weakest.fix)} Dlhodobý kontakt veď v jeho komunikačnom kóde.</p>`;

  return `
  <div class="advisor-note">
    <strong>Toto je pracovná vrstva poradcu — a ukazujeme ju otvorene.</strong> Nižšie je vidieť, ako sa tvoje odpovede prekladajú do prípravy na rozhovor: v akom jazyku ti dávajú zmysel argumenty a nakoľko si podľa vlastných odpovedí pripravený na zmenu. Žiadna skrytá vrstva neexistuje — čo vidíš ty, vidí aj poradca.
  </div>

  <div class="verdict ${t.key}">
    <div class="gauge" style="background:conic-gradient(${accent} ${totalPct}%,rgba(245,241,232,0.06) 0)">
      <div class="gauge-inner"><div class="gauge-pct">${totalPct}%</div><div class="gauge-cap">pripravenosť</div></div>
    </div>
    <div class="verdict-body">
      <span class="verdict-tag">${esc(t.tag)}</span>
      <div class="verdict-title">${esc(t.title)}</div>
      <div class="verdict-desc">${esc(t.desc)}</div>
    </div>
  </div>

  <div class="section-title">Komunikačný kód klienta</div>
  <div class="lead-box" style="margin-top:0">
    <p><strong>Toto je návod, ako s klientom hovoriť odteraz vo VŠETKOM</strong> — pri cieľoch, ponuke, námietkach aj follow-upe. Silné preferencie (3:0) sú najspoľahlivejšie páky; mierne (2:1) ber orientačne a overuj kalibráciou v rozhovore.</p>
  </div>
  ${strongTags?`<div class="code-group"><div class="code-group-title">Silné preferencie — istota</div><div class="code-tags">${strongTags}</div></div>`:''}
  ${mildTags?`<div class="code-group"><div class="code-group-title">Mierne preferencie — orientačne</div><div class="code-tags">${mildTags}</div></div>`:''}

  <div class="section-title">Ako komunikovať — metaprogram po metaprograme</div>
  ${tips}

  <div class="section-title">Pripravenosť podľa oblastí</div>
  ${dimRows}

  <div class="lead-box" style="margin-top:26px">
    <h3>Odporúčaný ďalší krok</h3>
    ${nextStep}
  </div>`;
}

/* ============ NAVIGÁCIA ============ */
function goNextMp(){ if(state.mpCurrent<state.mpQuestions.length-1){ state.mpCurrent++; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
function goPrevMp(){ if(state.mpCurrent>0){ state.mpCurrent--; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
function goNextRd(){ if(state.rdCurrent<RD_QUESTIONS.length-1){ state.rdCurrent++; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
function goPrevRd(){ if(state.rdCurrent>0){ state.rdCurrent--; render(); window.scrollTo({top:0,behavior:'smooth'}); } }

/* Voľba sa dá potvrdiť myšou aj klávesnicou (Enter / medzerník). */
function onChoose(el,handler){
  el.addEventListener('click',handler);
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handler(); } });
}

function bindEvents(){
  const nameInput=document.getElementById('nameInput');
  if(nameInput){
    nameInput.addEventListener('input',e=>{ state.name=e.target.value; const b=document.getElementById('startBtn'); if(b) b.disabled=!state.name.trim(); });
    nameInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&state.name.trim()){ state.screen='mp'; render(); window.scrollTo({top:0}); } });
  }
  const startBtn=document.getElementById('startBtn');
  if(startBtn) startBtn.addEventListener('click',()=>{ if(!state.name.trim())return; state.screen='mp'; render(); window.scrollTo({top:0,behavior:'smooth'}); });

  if(state.screen==='mp'){
    document.querySelectorAll('.option').forEach(opt=>{
      onChoose(opt,()=>{ state.mpAnswers[state.mpCurrent]=opt.getAttribute('data-val'); render(); setTimeout(goNextMp,300); });
    });
    const n=document.getElementById('nextBtn'); if(n) n.addEventListener('click',goNextMp);
    const p=document.getElementById('prevBtn'); if(p) p.addEventListener('click',goPrevMp);
    const f=document.getElementById('finishMpBtn'); if(f) f.addEventListener('click',()=>{ state.screen='bridge'; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  }

  const startRd=document.getElementById('startRdBtn');
  if(startRd) startRd.addEventListener('click',()=>{ state.screen='rd'; render(); window.scrollTo({top:0,behavior:'smooth'}); });

  if(state.screen==='rd'){
    document.querySelectorAll('.option').forEach(opt=>{
      onChoose(opt,()=>{ state.rdAnswers[state.rdCurrent]=parseInt(opt.getAttribute('data-idx'),10); render(); setTimeout(goNextRd,300); });
    });
    const n=document.getElementById('nextRdBtn'); if(n) n.addEventListener('click',goNextRd);
    const p=document.getElementById('prevRdBtn'); if(p) p.addEventListener('click',goPrevRd);
    const f=document.getElementById('finishRdBtn'); if(f) f.addEventListener('click',()=>{ state.screen='results'; state.view='client'; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  }

  document.querySelectorAll('.view-btn').forEach(b=>{
    b.addEventListener('click',()=>{ state.view=b.getAttribute('data-view'); render(); window.scrollTo({top:0,behavior:'smooth'}); });
  });

  const printBtn=document.getElementById('printBtn'); if(printBtn) printBtn.addEventListener('click',()=>window.print());
  const restartBtn=document.getElementById('restartBtn');
  if(restartBtn) restartBtn.addEventListener('click',()=>{
    state.screen='intro'; state.name=''; state.mpCurrent=0; state.mpAnswers={}; state.rdCurrent=0; state.rdAnswers={}; state.view='client';
    state.mpQuestions=prepareMpQuestions();
    render(); window.scrollTo({top:0,behavior:'smooth'});
  });
}

render();
</script>
</body>
</html>
