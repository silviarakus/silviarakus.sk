<!DOCTYPE html>
<html lang="sk">
<head>
<title>Zóna pre klientov — prihlásenie</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--obsidian:#0B0D10;--graphite:#1C2128;--deep-charcoal:#11151A;--bone:#F5F1E8;--ash-grey:#8E8E8E;--soft-sand:#D8C7AA;--ember-copper:#C66A2B;--electric-ember:#FF7A1A;--hairline:rgba(245,241,232,.08);--hairline-strong:rgba(245,241,232,.16);--hairline-copper:rgba(198,106,43,.35);--font-sans:"Manrope",ui-sans-serif,system-ui,sans-serif;--font-display:"Sora",ui-sans-serif,system-ui,sans-serif;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--obsidian);color:var(--bone);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
body::before{content:"";pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(198,106,43,.22),transparent 70%)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember-copper);outline-offset:3px}
.wrap{position:relative;width:100%;max-width:1000px;margin:0 auto;padding:0 24px}
@media(max-width:480px){.wrap{padding:0 16px}}
.topbar{padding:22px 0}.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:.82rem;text-decoration:none}
.topbar a.small{font-size:.82rem;color:var(--ash-grey);text-decoration:none;border-bottom:1px solid var(--hairline)}
.topbar a.small:hover{color:var(--bone)}
main{flex:1;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.3em;color:var(--ember-copper)}
.eyebrow::before{content:"";height:1px;width:28px;background:var(--ember-copper)}
.lead{margin-top:16px;color:var(--ash-grey);font-size:1.02rem;line-height:1.75;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 22px;border-radius:3px;font:inherit;font-size:.95rem;font-weight:800;text-decoration:none;cursor:pointer;border:1px solid transparent;background:var(--ember-copper);color:var(--bone);transition:background-color .25s}
.btn:hover{background:var(--electric-ember)}
footer{border-top:1px solid var(--hairline);padding:26px 0;background:var(--deep-charcoal);font-size:.82rem;color:var(--ash-grey)}
footer a{text-decoration:none;border-bottom:1px solid var(--hairline)}
.box{max-width:440px;margin:60px auto 90px;background:var(--graphite);border:1px solid var(--hairline);border-radius:4px;padding:36px 30px}
@media(max-width:480px){.box{padding:26px 18px;margin-top:30px}}
.box h1{margin-top:16px;font-size:1.7rem}
form{display:grid;gap:14px;margin-top:26px}
label{display:grid;gap:7px;font-size:.82rem;font-weight:700;color:var(--soft-sand)}
input{width:100%;font:inherit;font-size:16px;color:var(--bone);background:var(--deep-charcoal);border:1px solid var(--hairline-strong);border-radius:3px;padding:13px 14px}
input:focus{outline:none;border-color:var(--ember-copper)}
.err{color:#ff9a6b;font-size:.92rem}
.help{margin-top:22px;padding-top:18px;border-top:1px solid var(--hairline);font-size:.88rem;color:var(--ash-grey);line-height:1.7}
.help a{color:var(--soft-sand);text-decoration:none;border-bottom:1px solid var(--hairline-copper)}
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><a class="brand" href="/">Silvia Rakus</a><a class="small" href="/">Späť na úvod</a></div></header>
<main><div class="wrap">
  <div class="box">
    <p class="eyebrow">Zóna pre klientov</p>
    <h1>Prihlásenie</h1>
    <p class="lead">Diagnostiky sú dostupné pre mojich klientov. Heslo ti pošlem po úhrade.</p>
    <form method="post" action="/api/klient-login">
      <input type="hidden" name="next" id="next" value="/klient/">
      <label>Heslo
        <input type="password" name="heslo" autocomplete="current-password" required autofocus>
      </label>
      <p class="err" id="err" hidden>Nesprávne heslo. Skús to prosím znova.</p>
      <button class="btn" type="submit"><span>Prihlásiť sa</span><span aria-hidden="true">→</span></button>
    </form>
    <p class="help">Ešte nemáš heslo? <a href="/#stretnutie">Dohodni si stretnutie</a> alebo napíš na <a href="mailto:silvia.rakus@modernymakler.sk">silvia.rakus@modernymakler.sk</a>.</p>
  </div>
</div></main>
<footer><div class="wrap">© 2026 Silvia Rakus · silviarakus.sk</div></footer>
<script>
var p=new URLSearchParams(location.search);
var er=document.getElementById('err');if(p.get('chyba')==='limit'){er.textContent='Príliš veľa pokusov. Skús to znova o 15 minút.';er.hidden=false;}else if(p.get('chyba'))er.hidden=false;
var n=p.get('next');if(n&&/^\/klient(\/|$)/.test(n))document.getElementById('next').value=n;
</script>
</body>
</html>
